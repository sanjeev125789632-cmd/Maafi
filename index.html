<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">

<title>A note</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0e0e10;
    color: #8b8880;
    font: 400 14px/1.5 Georgia, "Times New Roman", serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #root { position: fixed; inset: 0; }
  #hint {
    position: fixed;
    left: 0; right: 0;

    text-align: center;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #55524c;
    transition: opacity 700ms ease;
    pointer-events: none;
  }
  #hint[data-off="1"] { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    #hint { transition: none; }
  }
</style>

      camera: { position: [0, 0, 5], fov: 40 },
      gl: { antialias: true }
    },
      h('color', { attach: 'background', args: ['#0e0e10'] }),
      h('ambientLight', { intensity: 0.9 }),
      h('directionalLight', { position: [2.5, 3.5, 4], intensity: 0.85 }),
      h(Note, { step: step, reduced: reduced })
    );
  }

  createRoot(document.getElementById('root')).render(h(App));
})();
</script>
