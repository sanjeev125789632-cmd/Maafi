<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maafi RAG</title>
<style>
  :root { --bg:#0e0e10; --panel:#17171a; --text:#e6e3dc; --muted:#8b8880; --accent:#d9b36c; --border:#2a2a2e; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font: 500 22px/1.2 Georgia, serif; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font:inherit; }
  button { padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#1a1a1a; font:600 14px system-ui; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #answer { margin-top:24px; white-space:pre-wrap; }
  #answer.err { color:#e07a6b; }
  .src { margin-top:12px; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--panel); font-size:13px; }
  .src b { color: var(--accent); font-weight:600; }
  .src p { margin:6px 0 0; color:var(--muted); }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:28px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Maafi RAG</h1>
  <p class="sub">Answers are generated by Claude from passages retrieved out of your document folder.</p>
  <form id="f">
    <input id="q" name="q" placeholder="Ask a question about your documents" autocomplete="off" required>
    <button id="go">Ask</button>
  </form>
  <div id="answer"></div>
  <div id="sources"></div>
</main>
<script>
  const f = document.getElementById('f'), q = document.getElementById('q'), go = document.getElementById('go');
  const out = document.getElementById('answer'), srcs = document.getElementById('sources');

  function el(tag, text) { const e = document.createElement(tag); if (text != null) e.textContent = text; return e; }

  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    go.disabled = true; out.className = ''; out.textContent = 'Thinking…'; srcs.replaceChildren();
    try {
      const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q.value }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || r.statusText);
      out.textContent = data.answer;
      if (data.sources.length) srcs.append(el('h2', 'Sources'));
      data.sources.forEach((s, i) => {
        const d = el('div'); d.className = 'src';
        const head = el('div'); head.append(el('b', '[' + (i + 1) + '] '), document.createTextNode(s.chunk_id + '  ·  score ' + s.score));
        d.append(head, el('p', s.text.length > 400 ? s.text.slice(0, 400) + '…' : s.text));
        srcs.append(d);
      });
    } catch (e) {
      out.className = 'err'; out.textContent = 'Error: ' + e.message;
    } finally { go.disabled = false; }
  });
</script>
</body>
</html>
